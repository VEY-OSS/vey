name: Docker
permissions:
  contents: read
  packages: write
  actions: write

on:
  push:
    tags:
      - 'vey-proxy-v*'
      - 'vey-dcgen-v*'
      - 'vey-iploc-v*'
      - 'vey-statsd-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select images
    runs-on: ubuntu-26.04
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      app: ${{ steps.meta.outputs.app }}
      version: ${{ steps.meta.outputs.version }}
      images: ${{ steps.meta.outputs.images }}
    steps:
      - name: Parse tag
        id: meta
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          app="${tag%-v*}"
          version="${tag#"${app}-v"}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          case "${app}" in
            vey-proxy)
              images='[{"file":"vey-proxy/docker/debian.Dockerfile","variant":"debian"},{"file":"vey-proxy/docker/alpine.Dockerfile","variant":"alpine"}]'
              ;;
            vey-statsd)
              images='[{"file":"vey-statsd/docker/debian.Dockerfile","variant":"debian"},{"file":"vey-statsd/docker/alpine.Dockerfile","variant":"alpine"}]'
              ;;
            vey-dcgen)
              images='[{"file":"vey-dcgen/docker/debian.Dockerfile","variant":"debian"},{"file":"vey-dcgen/docker/alpine.Dockerfile","variant":"alpine"}]'
              ;;
            vey-iploc)
              images='[{"file":"vey-iploc/docker/debian.Dockerfile","variant":"debian"},{"file":"vey-iploc/docker/alpine.Dockerfile","variant":"alpine"}]'
              ;;
            *)
              echo "no Dockerfile for tag ${tag}" >&2
              exit 1
              ;;
          esac
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "app=${app}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.image.variant }} (${{ matrix.platform.name }})
    needs: plan
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.images) }}
        platform:
          - name: amd64
            runner: ubuntu-26.04
            os: linux/amd64
          - name: arm64
            runner: ubuntu-26.04-arm
            os: linux/arm64
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform.os }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ needs.plan.outputs.owner }}/${{ needs.plan.outputs.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ needs.plan.outputs.app }}-${{ matrix.image.variant }}-${{ matrix.platform.name }}
          cache-to: type=gha,scope=${{ needs.plan.outputs.app }}-${{ matrix.image.variant }}-${{ matrix.platform.name }},mode=max
      - name: Export digest
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ needs.plan.outputs.app }}-${{ matrix.image.variant }}-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image.variant }} manifest
    needs: [plan, build]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.images) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ needs.plan.outputs.app }}-${{ matrix.image.variant }}-*
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create manifest list
        run: |
          set -eu
          image="ghcr.io/${{ needs.plan.outputs.owner }}/${{ needs.plan.outputs.app }}"
          version="${{ needs.plan.outputs.version }}"
          variant="${{ matrix.image.variant }}"
          tags=()
          if [ "${variant}" = "debian" ]; then
            tags+=(-t "${image}:${version}" -t "${image}:${version}-debian")
          else
            tags+=(-t "${image}:${version}-${variant}")
          fi
          digests=()
          for digest in "${RUNNER_TEMP}/digests"/*; do
            digests+=("${image}@sha256:$(basename "${digest}")")
          done
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected amd64 and arm64 digests, found ${#digests[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
          docker buildx imagetools inspect "${tags[1]}"
