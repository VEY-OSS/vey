name: PGO release
permissions:
  contents: read

on:
  push:
    tags:
      - 'vey-proxy-v*'
      - 'vey-statsd-v*'
      - 'vey-keyless-v*'
      - 'vey-dcgen-v*'
      - 'vey-iploc-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  profile:
    name: Generate profile
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Parse tag
        id: meta
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          app="${tag%-v*}"
          version="${tag#"${app}-v"}"
          case "${app}" in
            vey-proxy|vey-dcgen|vey-iploc) workload=proxy ;;
            vey-statsd) workload=statsd ;;
            vey-keyless) workload=keyless ;;
            *)
              echo "no PGO workload for ${tag}" >&2
              exit 1
              ;;
          esac
          test -x "scripts/pgo/${app}.sh"
          echo "app=${app}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "workload=${workload}" >> "${GITHUB_OUTPUT}"
      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: llvm-tools
      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          case "${{ steps.meta.outputs.workload }}" in
            proxy)
              sudo apt-get install capnproto libjemalloc-dev libc-ares-dev libssl-dev libpython3-dev liblua5.4-dev libbpf-dev
              sudo apt-get install ca-certificates python3-requests python3-pycurl python3-dnspython python3-socks
              sudo apt-get install c-icap netcat-openbsd wait4x jq
              sudo sed -i 's/^MaxServers .*/MaxServers 100/' /etc/c-icap/c-icap.conf
              sudo systemctl start c-icap
              ;;
            statsd)
              sudo apt-get install capnproto libjemalloc-dev jq wait4x
              ;;
            keyless)
              sudo apt-get install capnproto libmimalloc-dev libssl-dev libcrypto-mb-dev libqat-dev libusdm-dev pkg-config
              ;;
          esac
      - name: Install binutils
        run: cargo install cargo-binutils@0.3.6
      - name: Listen udpdump port
        if: steps.meta.outputs.workload == 'proxy'
        run: nc -u -l -k 127.0.0.1 5555 >/dev/null &
      - name: Backup /etc/hosts # delete this after systemd-resolved 261
        if: steps.meta.outputs.workload == 'proxy'
        run: sudo cp /etc/hosts /etc/hosts.backup
      - name: Edit /etc/hosts   # delete this after systemd-resolved 261
        if: steps.meta.outputs.workload == 'proxy'
        run: |
          cp /etc/hosts /tmp/ci-hosts
          echo "127.0.0.1 httpbin.local" >> /tmp/ci-hosts
          echo "127.0.0.1 vey-proxy.local" >> /tmp/ci-hosts
          sudo cp /tmp/ci-hosts /etc/hosts
      - name: Add static records to systemd-resolved # work only with systemd-resolved >= 261
        if: steps.meta.outputs.workload == 'proxy'
        run: |
          sudo mkdir -p /run/systemd/resolve/static.d
          sudo cp ${{ github.workspace }}/scripts/testcases/vey-bench/resolved-ci-static.rr /run/systemd/resolve/static.d/
          sudo systemctl restart systemd-resolved
          resolvectl query httpbin.local vey-proxy.local
      - name: Generate profile
        run: ./scripts/pgo/${{ steps.meta.outputs.app }}.sh
      - name: Restore /etc/hosts # delete this after systemd-resolved 261
        if: always() && steps.meta.outputs.workload == 'proxy'
        run: sudo mv /etc/hosts.backup /etc/hosts
      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: pgo-${{ steps.meta.outputs.app }}-${{ steps.meta.outputs.version }}
          path: scripts/pgo/profile/${{ steps.meta.outputs.app }}.profdata
          if-no-files-found: error
          retention-days: 90
