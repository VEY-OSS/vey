<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="left-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="right-wing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200" />
      <stop offset="100%" stop-color="#F7971E" />
    </linearGradient>
    <linearGradient id="top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#FFD200" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1121" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#09131F" />
    </linearGradient>
    <radialGradient id="glow-blue" cx="16%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#0072FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0072FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-green" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#11998E" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#11998E" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-width="0.7" stroke-opacity="0.08" />
    </pattern>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Layers -->
  <rect width="1280" height="640" fill="url(#bg-grad)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#glow-blue)" />
  <rect width="1280" height="640" fill="url(#glow-green)" />
  <rect x="0" y="0" width="1280" height="4" fill="url(#top-bar)" />

  <!-- Header: Logo + Wordmark + Tagline -->
  <g transform="translate(154, 114) scale(0.56)" filter="url(#shadow)">
    <!-- Left Wing (Incoming Traffic) -->
    <path d="M -145 -100 L -65 -100 L -5 20 L -45 100 Z" fill="url(#left-wing)" />
    <!-- Right Wing (Outgoing Traffic) -->
    <path d="M 145 -100 L 65 -100 L 5 20 L 45 100 Z" fill="url(#right-wing)" />
    <!-- Center Diamond (Gateway/Proxy Core) -->
    <polygon points="0,35 40,115 0,195 -40,115" fill="url(#core)" />
  </g>

  <text x="274" y="140" font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="8">VEY</text>

  <!-- Rust + License Pill -->
  <rect x="468" y="96" width="244" height="34" rx="17" fill="#0F172A" fill-opacity="0.92" stroke="#38BDF8" stroke-opacity="0.48" stroke-width="1.2" />
  <text x="590" y="118" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1.2">ASYNC RUST · APACHE-2.0</text>

  <!-- Subtitle & One-liner -->
  <text x="276" y="184" font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="27" font-weight="600" fill="#F1F5F9">Modular Proxy &amp; Gateway Suite in Rust</text>
  <text x="276" y="218" font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#A3B4C9">Unified proxy &amp; security auditing, TLS/Keyless gateway, StatsD relay &amp; benchmark suite</text>

  <!-- Capability Grid (2 x 2) -->
  <!-- Card 1: vey-proxy -->
  <g transform="translate(76, 258)">
    <rect width="552" height="106" rx="14" fill="#111C33" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="18" width="5" height="70" rx="2.5" fill="url(#left-wing)" />
    <text x="26" y="42" font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">vey-proxy · Proxy &amp; Auditing</text>
    <text x="26" y="75" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="500" fill="#93C5FD">HTTP/SOCKS · Reverse · TPROXY/SNI · TLS MITM · DPI · ICAP</text>
  </g>

  <!-- Card 2: vey-gateway, vey-keyless & vey-statsd -->
  <g transform="translate(652, 258)">
    <rect width="552" height="106" rx="14" fill="#111C33" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="18" width="5" height="70" rx="2.5" fill="url(#right-wing)" />
    <text x="26" y="42" font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">vey-gateway, vey-keyless &amp; vey-statsd</text>
    <text x="26" y="75" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="500" fill="#6EE7B7">TLS Gateway · Keyless SSL · StatsD Metrics Pipeline</text>
  </g>

  <!-- Card 3: vey-bench -->
  <g transform="translate(76, 384)">
    <rect width="552" height="106" rx="14" fill="#111C33" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="18" width="5" height="70" rx="2.5" fill="url(#core)" />
    <text x="26" y="42" font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">vey-bench · Protocol Benchmark</text>
    <text x="26" y="75" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="500" fill="#FDE68A">HTTP/1-3 · WebSocket · TLS/TLCP · DoT/DoH/DoQ/DoH3 · Thrift</text>
  </g>

  <!-- Card 4: Companion Services & CLI Utility -->
  <g transform="translate(652, 384)">
    <rect width="552" height="106" rx="14" fill="#111C33" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="18" width="5" height="70" rx="2.5" fill="#22D3EE" />
    <text x="26" y="42" font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">Companion Services &amp; CLI Utility</text>
    <text x="26" y="75" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="500" fill="#67E8F9">vey-dcgen (Dynamic CA) · vey-iploc (GeoIP) · vey-mkcert</text>
  </g>

  <!-- Bottom Divider -->
  <line x1="76" y1="524" x2="1204" y2="524" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />

  <!-- Bottom Suite Pills -->
  <g transform="translate(76, 544)">
    <!-- General Applications -->
    <rect x="0" y="0" width="96" height="32" rx="8" fill="#0F2744" stroke="#00C6FF" stroke-opacity="0.65" stroke-width="1.2" />
    <text x="48" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">vey-proxy</text>

    <rect x="104" y="0" width="112" height="32" rx="8" fill="#0D2829" stroke="#38EF7D" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="160" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">vey-gateway</text>

    <rect x="224" y="0" width="112" height="32" rx="8" fill="#0D2829" stroke="#38EF7D" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="280" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">vey-keyless</text>

    <rect x="344" y="0" width="104" height="32" rx="8" fill="#0D2829" stroke="#38EF7D" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="396" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">vey-statsd</text>

    <rect x="456" y="0" width="96" height="32" rx="8" fill="#2A2111" stroke="#FFD200" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="504" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">vey-bench</text>

    <!-- Companion Services & Utility -->
    <rect x="566" y="0" width="94" height="32" rx="8" fill="#111C33" stroke="#334155" stroke-width="1" />
    <text x="613" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="500" fill="#94A3B8" text-anchor="middle">vey-dcgen</text>

    <rect x="668" y="0" width="94" height="32" rx="8" fill="#111C33" stroke="#334155" stroke-width="1" />
    <text x="715" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="500" fill="#94A3B8" text-anchor="middle">vey-iploc</text>

    <rect x="770" y="0" width="102" height="32" rx="8" fill="#111C33" stroke="#334155" stroke-width="1" />
    <text x="821" y="21" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="500" fill="#94A3B8" text-anchor="middle">vey-mkcert</text>
  </g>

  <!-- Repo URL -->
  <text x="1204" y="566" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="600" fill="#94A3B8" text-anchor="end">github.com/VEY-OSS/vey</text>
</svg>
