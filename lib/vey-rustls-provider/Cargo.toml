[package]
name = "vey-rustls-provider"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
rustls.workspace = true
aws-lc-rs = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
quinn-proto = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
ring = { workspace = true, optional = true }

[features]
quic = ["dep:quinn", "dep:quinn-proto", "dep:bytes", "dep:rand"]
rustls-ring = ["rustls/ring", "dep:ring"]
rustls-aws-lc = ["rustls/aws-lc-rs", "dep:aws-lc-rs", "aws-lc-rs/alloc"]
rustls-aws-lc-fips = ["rustls/fips", "dep:aws-lc-rs", "aws-lc-rs/alloc", "aws-lc-rs/fips"]
