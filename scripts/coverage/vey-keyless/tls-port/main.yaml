log: journal

stat:
  target:
    udp: 127.0.0.1:8125
  prefix: vey-keyless

server:
  - name: tls_port
    type: plain_tls_port
    listen: "[::]:1300"
    tls:
      certificate: ../rsa2048.crt
      private_key: ../keys/rsa2048.key
    server: keyless

  - name: keyless
    type: cloudflare
    multiplex_queue_depth: 128
    extra_metrics_tags:
      cluster: default

store:
  - name: local
    type: local
    dir: ../keys
