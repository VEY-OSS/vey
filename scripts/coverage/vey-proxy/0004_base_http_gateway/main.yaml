---

log: journal

stat:
  target:
    udp: 127.0.0.1:8125

resolver:
  - name: default
    type: c-ares

escaper:
  - name: default
    type: direct_fixed
    resolver: default
    egress_net_filter:
      default: allow
      allow: 127.0.0.0/8

site_group:
  - name: httpbin
    static_sites:
      - exact_match: httpbin.local
        upstream: 127.0.0.1:80
        tls_server:
          cert_pairs:
            certificate: ../httpbin.local.pem
            private-key: ../httpbin.local-key.pem

server:
  - name: http
    type: http_expose
    listen: 127.0.0.1:8080
    escaper: default
    site_group: httpbin
    flush_task_log_on_created: true
    flush_task_log_on_connected: true
    task_log_flush_interval: 1s
    tcp_sock_speed_limit: 900K
  - name: tls
    type: plain_tls_port
    listen: 127.0.0.1:8443
    server: http
    tls_server:
      cert_pairs:
        certificate: ../httpbin.local.pem
        private-key: ../httpbin.local-key.pem
  - name: https
    type: http_expose
    listen: 127.0.0.1:9443
    escaper: default
    enable_tls_server: true
    global_tls_server:
      cert_pairs:
        certificate: ../httpbin.local.pem
        private-key: ../httpbin.local-key.pem
    site_group: httpbin
