runtime:
  thread_number: 2

worker:
  thread_number: 2

importer:
  - name: statsd
    type: statsd
    collector: aggregate_1s
    listen: 127.0.0.1:8125

collector:
  - name: aggregate_1s
    type: aggregate
    emit_interval: 200ms
    exporter: prometheus_push

exporter:
  - name: prometheus_push
    type: prometheus_push
    server: 127.0.0.1
    port: 9090
    path: /api/v1/write
    emit_interval: 1s
    prefix: vey.example
