runtime:
  thread_number: 2

worker:
  thread_number: 2

importer:
  - name: statsd
    type: statsd
    collector: aggregate_1s
    listen: 127.0.0.1:8125

collector:
  - name: aggregate_1s
    type: aggregate
    emit_interval: 200ms
    exporter: influxdb

exporter:
  - name: influxdb
    type: influxdb_v2
    server: 127.0.0.1
    port: 8428
    bucket: vm
    emit_interval: 5s
    prefix: vm.influx
