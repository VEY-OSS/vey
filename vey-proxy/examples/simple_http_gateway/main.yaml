---
runtime:
  thread_number: 2

log: journal

controller:
  local:
    recv_timeout: 30
    send_timeout: 1

site_group:
  - name: default
    static_sites:
      - exact_match: www.xjtu.edu.cn
        upstream: www.xjtu.edu.cn:80

server:
  - name: test
    escaper: default
    type: http_expose
    listen:
      address: "[::]:10080"
    tcp_sock_speed_limit: 100M
    site_group: default

resolver:
  - name: default
    type: c-ares

escaper:
  - name: default
    type: direct_fixed
    no_ipv6: true
    resolver: default
    resolve_strategy: IPv4Only
    tcp_sock_speed_limit: 80M
    udp_sock_speed_limit: 10M
    egress_network_filter:
      default: allow
      allow:
        - 127.0.0.1
